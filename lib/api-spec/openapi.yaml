openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: github
    description: GitHub repository operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /github/preview:
    post:
      operationId: previewArchive
      tags: [github]
      summary: Preview archive contents
      description: Accepts an archive file (zip, tar, tar.gz, tgz, tar.bz2), extracts it in memory, and returns the list of top-level subfolders with file counts. Returns a sessionId to reference the temp data for upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PreviewArchiveBody"
      responses:
        "200":
          description: Subfolders found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /github/upload-selected:
    post:
      operationId: uploadSelectedFolders
      tags: [github]
      summary: Start background upload job
      description: Creates a background job to create one GitHub repository per selected subfolder. Returns a jobId immediately — poll /github/jobs/{jobId} for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSelectedBody"
      responses:
        "200":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadJobStarted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /github/jobs/{jobId}:
    get:
      operationId: getJob
      tags: [github]
      summary: Get background job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /github/me:
    get:
      operationId: getGithubUser
      tags: [github]
      summary: Get authenticated GitHub user
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubUser"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /github/repos:
    get:
      operationId: listRecentRepos
      tags: [github]
      summary: List recently created repos
      responses:
        "200":
          description: List of repos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GithubRepo"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    PreviewArchiveBody:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Archive file to extract (zip, tar, tar.gz, tgz, tar.bz2, tar.xz)

    PreviewResult:
      type: object
      properties:
        sessionId:
          type: string
        folders:
          type: array
          items:
            $ref: "#/components/schemas/FolderInfo"
        archiveName:
          type: string
      required:
        - sessionId
        - folders
        - archiveName

    FolderInfo:
      type: object
      properties:
        name:
          type: string
        fileCount:
          type: integer
      required:
        - name
        - fileCount

    UploadSelectedBody:
      type: object
      properties:
        sessionId:
          type: string
        selectedFolders:
          type: array
          items:
            type: string
        repoNameOverrides:
          type: object
          additionalProperties:
            type: string
          description: Optional map of folderName → custom repo name. Defaults to folder name.
        private:
          type: boolean
          default: false
        description:
          type: string
      required:
        - sessionId
        - selectedFolders

    UploadJobStarted:
      type: object
      properties:
        jobId:
          type: string
      required:
        - jobId

    JobProgress:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        currentRepo:
          type: string
        currentAction:
          type: string
      required:
        - total
        - completed

    JobState:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        progress:
          $ref: "#/components/schemas/JobProgress"
        results:
          type: array
          items:
            $ref: "#/components/schemas/RepoUploadResult"
        error:
          type: string
        createdAt:
          type: integer
      required:
        - jobId
        - status
        - progress
        - results
        - createdAt

    RepoUploadResult:
      type: object
      properties:
        folderName:
          type: string
        repoName:
          type: string
        repoUrl:
          type: string
        filesUploaded:
          type: integer
        success:
          type: boolean
        error:
          type: string
      required:
        - folderName
        - repoName
        - repoUrl
        - filesUploaded
        - success

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GithubUser:
      type: object
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        publicRepos:
          type: integer
      required:
        - login
        - avatarUrl
        - publicRepos

    GithubRepo:
      type: object
      properties:
        name:
          type: string
        fullName:
          type: string
        url:
          type: string
        private:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
      required:
        - name
        - fullName
        - url
        - private
        - createdAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error
