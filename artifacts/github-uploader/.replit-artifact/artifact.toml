kind = "web"
previewPath = "/"
title = "GitHub Repo Creator"
version = "1.0.0"
id = "artifacts/github-uploader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25139

[services.development]
run = "pnpm --filter @workspace/github-uploader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/github-uploader", "run", "build" ]
publicDir = "artifacts/github-uploader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25139"
BASE_PATH = "/"
